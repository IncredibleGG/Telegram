name: Android Release (LuminaGram)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout (with native submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Reject Java-style \uXXXX escapes in default strings
        # 13.0 sync: values/strings.xml no longer goes through aapt2 for the default strings;
        # TelegramStringsTask packs it into localization_*.bin and strips every backslash, so
        # an escaped em dash would ship as the literal text "u2014". Write the UTF-8 character.
        run: |
          if git grep -nE '\\u[0-9a-fA-F]{4}' -- '*/res/values*/strings.xml'; then
            echo "::error::Java-style unicode escape in strings.xml (TelegramStringsTask would ship it as literal text)"
            exit 1
          fi
          echo "no unicode escapes in strings.xml"

      - name: Free up disk space
        run: |
          echo "=== disk before ==="; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "=== disk after ==="; df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages (build-tools 36 / platform 36+35 / NDK / cmake)
        # 13.0 sync: the androidx media3 submodule (TMessagesProj_Modules/media) compiles
        # against android-35 and uses AGP's default build-tools, so install those as well.
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Decode signing keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p TMessagesProj/config
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore
          test -s TMessagesProj/config/release.keystore && echo "keystore decoded ($(stat -c%s TMessagesProj/config/release.keystore) bytes)"

      - name: Build standalone release APK (signed with injected key)
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ./gradlew --no-daemon :TMessagesProj_AppStandalone:assembleAfatFullStandalone --stacktrace

      - name: Verify APK is signed with the new key
        run: |
          APK=$(ls -t TMessagesProj_AppStandalone/build/outputs/apk/afatFull/standalone/*.apk | head -1)
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -i "SHA-256"

      - name: Sanity-check APK label, icon and kept strings (aapt2)
        # 13.0 sync: release builds now shrink resources and discard every string except
        # AppName/AppNameBeta (+ our disguise launcher labels). Fail fast if that strips the
        # launcher label/icon instead of shipping an APK that installs as a bare package name.
        run: |
          APK=$(ls -t TMessagesProj_AppStandalone/build/outputs/apk/afatFull/standalone/*.apk | head -1)
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          "$AAPT2" dump badging "$APK" > badging.txt
          grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label:|application-icon-[0-9]+:|application:|launchable-activity:)" badging.txt || true
          grep -q "^application-label:'LuminaGram'" badging.txt || { echo "::error::application-label is not LuminaGram"; exit 1; }
          grep -qE "^application: label='LuminaGram' icon='[^']+'" badging.txt || { echo "::error::application label/icon missing"; exit 1; }
          "$AAPT2" dump resources "$APK" > resources.txt
          for s in AppName LuminaDisguiseAppLabel LuminaDisguiseNotesLabel LuminaDisguiseClockLabel; do
            grep -qE "string/$s( |$)" resources.txt || { echo "::error::string/$s was stripped from the APK"; exit 1; }
            echo "kept string/$s"
          done

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(ls -t TMessagesProj_AppStandalone/build/outputs/apk/afatFull/standalone/*.apk | head -1)
          cp "$APK" out/LuminaGram-standalone-release.apk
          ls -la out

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaGram-standalone-release
          path: out/LuminaGram-standalone-release.apk
          if-no-files-found: error
